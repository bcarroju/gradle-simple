plugins {
    id "org.sonarqube" version "5.1.0.4882"  // ← Updated to 5.x for Gradle 9 compatibility
    id "java"
    id "maven-publish"
}

group = 'com.github.jitpack'
version = '2.0'

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

sonarqube {
    properties {
        property "sonar.projectKey", "demo"
        property "sonar.projectName", "demo"
        property "sonar.host.url", "http://localhost:9000"
        property "sonar.token", "sqa_9510886a196b6c7b41d91d0056760a748b83f138"  // ← Changed from 'login' to 'token'
        property "sonar.gradle.skipCompile", "true"  // ← Suppress deprecation warning
    }
}

dependencies {
    implementation 'com.google.guava:guava:29.0-jre'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

wrapper {
    gradleVersion = "9.2.1"
    distributionType = Wrapper.DistributionType.ALL
}